apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  mysql-root-password: {{ .Values.secrets.mysqlRootPassword | quote }}
  mysql-password: {{ .Values.secrets.mysqlPassword | quote }}
  mysql-database: {{ .Values.secrets.mysqlDatabase | quote }}
  mysql-user: {{ .Values.secrets.mysqlUser | quote }}
  wordpress-admin-user: {{ .Values.secrets.wordpressAdminUser | quote }}
  wordpress-admin-password: {{ .Values.secrets.wordpressAdminPassword | quote }}
  wordpress-admin-email: {{ .Values.secrets.wordpressAdminEmail | quote }}
  woo-consumer-key: {{ .Values.secrets.wooConsumerKey | quote }}
  woo-consumer-secret: {{ .Values.secrets.wooConsumerSecret | quote }}
  gateway-db-password: {{ .Values.secrets.gatewayDbPassword | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  groq-api-key: {{ .Values.secrets.groqApiKey | quote }}
  seed-admin-password: {{ .Values.secrets.seedAdminPassword | quote }}
  seed-member-password: {{ .Values.secrets.seedMemberPassword | quote }}
  database-url: {{ printf "postgresql://gateway:%s@gateway-db:5432/gateway" .Values.secrets.gatewayDbPassword | quote }}
