apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gateway-db-data
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-db
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.storageClassName }}
  storageClassName: {{ .Values.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.gatewayDb.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-db
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway-db
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gateway-db
    spec:
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: gateway
            - name: POSTGRES_USER
              value: gateway
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: gateway-db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "gateway"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "gateway"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gatewayDb.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gateway-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-db
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-db
spec:
  selector:
    app.kubernetes.io/component: gateway-db
  ports:
    - port: 5432
      targetPort: 5432
