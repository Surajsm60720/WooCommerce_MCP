apiVersion: apps/v1
kind: Deployment
metadata:
  name: woocommerce-mcp
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: woocommerce-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: woocommerce-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/component: woocommerce-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: woocommerce-mcp
          image: {{ .Values.images.woocommerceMcp }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 3101
          env:
            - name: PORT
              value: "3101"
            - name: WOOCOMMERCE_URL
              value: http://wordpress
            - name: WOOCOMMERCE_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: woo-consumer-key
            - name: WOOCOMMERCE_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: woo-consumer-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3101
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3101
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.woocommerceMcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: woocommerce-mcp
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: woocommerce-mcp
spec:
  selector:
    app.kubernetes.io/component: woocommerce-mcp
  ports:
    - port: 3101
      targetPort: 3101
---
